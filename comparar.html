<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comparar textos</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><meta name="theme-color" content="#2563eb">
<style>:root{--bg:#f6f7f9;--card:#fff;--fg:#1c2330;--mut:#667085;--bd:#d9dde5;--pri:#2563eb;--pri-fg:#fff;--err:#c0262d;--ok:#157f3b;--warn:#a15c00;--sel:rgba(37,99,235,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#14171d;--card:#1d2230;--fg:#e8ebf2;--mut:#98a2b3;--bd:#323a4d;--pri:#4b82f0;--err:#ff7b80;--ok:#4ad07a;--warn:#f0b24a;--sel:rgba(75,130,240,.15)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1180px;margin:0 auto;padding:20px}
header.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
header.top a.back{color:var(--pri);text-decoration:none;font-size:14px}
header.top h1{font-size:22px;margin:0}
header.top .sub{color:var(--mut);font-size:14px;flex-basis:100%}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:0 0 10px}
button,.btn{font:inherit;padding:7px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg);cursor:pointer;text-decoration:none;display:inline-block}
button:hover:not(:disabled),.btn:hover{border-color:var(--pri)}
button.primary{background:var(--pri);color:var(--pri-fg);border-color:var(--pri)}
button.danger{color:var(--err)}
button.small{padding:3px 9px;font-size:13px}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.mt{margin-top:10px}
.spacer{flex:1}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:3px}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg)}
textarea{resize:vertical;min-height:70px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 16px}
.chk{display:flex;gap:6px;align-items:center;color:var(--fg);font-size:14px}
.chk input{width:auto}
.note{color:var(--mut);font-size:13px}
.drop{border:2px dashed var(--bd);border-radius:10px;padding:18px;text-align:center;color:var(--mut);transition:.15s}
.drop.over{border-color:var(--pri);background:var(--sel)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--bd);font-size:14px;vertical-align:top}
th{color:var(--mut);font-weight:600;white-space:nowrap}
th.sortable{cursor:pointer;user-select:none}
.tablewrap{overflow-x:auto}
td.trunc{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.act{white-space:nowrap}
.badge{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.b-ok{background:#dff5e6;color:#0c5a28;border-color:#bfe6cb}
.b-warn{background:#fff1d6;color:#7a4a00;border-color:#f1d9a3}
.b-bad{background:#ffe0d6;color:#8a2a05;border-color:#f2bfae}
.b-crit{background:#f8d4d4;color:#7a0d0d;border-color:#ecb1b1}
.b-mut{background:#eceff4;color:#475467;border-color:#d9dde5}
@media (prefers-color-scheme:dark){.b-ok{background:#12351f;color:#8de0ab;border-color:#1f5a35}.b-warn{background:#3a2c0d;color:#f3c777;border-color:#6b4f12}.b-bad{background:#3d1f14;color:#f5a98a;border-color:#6b3320}.b-crit{background:#401414;color:#f59a9a;border-color:#702020}.b-mut{background:#272d3d;color:#b4bccd;border-color:#3a4258}}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--fg);padding:18px 20px;max-width:760px;width:calc(100% - 24px)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog h3{margin:0 0 12px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1c2330;color:#fff;padding:9px 16px;border-radius:8px;font-size:14px;z-index:99;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border-radius:999px}
.tabs button.on{background:var(--pri);color:var(--pri-fg);border-color:var(--pri)}
.warnbox{background:#fff6e0;color:#6b4300;border:1px solid #f0d9a0;border-radius:8px;padding:9px 12px;font-size:14px;margin-bottom:12px}
@media (prefers-color-scheme:dark){.warnbox{background:#362a0c;color:#f3d79a;border-color:#6b4f12}}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd)}
.list li .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.thumb{border:1px solid var(--bd);border-radius:8px;padding:6px;text-align:center;background:var(--card)}
.thumb canvas,.thumb img{max-width:100%;height:auto;border:1px solid var(--bd);background:#fff}
.thumb .tools{display:flex;gap:3px;justify-content:center;margin-top:5px;flex-wrap:wrap}
.stat{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.stat .s{border:1px solid var(--bd);border-radius:8px;padding:6px 12px;background:var(--card)}
.stat .s b{display:block;font-size:20px}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--bd);margin:6px 0}
.bar span{display:block;height:100%}
progress{width:100%;height:10px}
pre.out,textarea.out{width:100%;min-height:260px;font:13px/1.4 ui-monospace,Consolas,monospace}
.diff{font:13px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-word;border:1px solid var(--bd);border-radius:8px;padding:8px;max-height:560px;overflow:auto;background:var(--card)}
.diff .add{background:#cdeed7;color:#0c3d1d}.diff .del{background:#f8d0d0;color:#5c1010;text-decoration:line-through}
@media (prefers-color-scheme:dark){.diff .add{background:#1a4a2c;color:#bdf0cf}.diff .del{background:#561b1b;color:#f6c4c4}}
.hm{border-collapse:separate;border-spacing:3px;width:auto}
.hm th.axis{text-align:right;white-space:nowrap}
.hm tr:last-child th.axis{text-align:center;white-space:normal;line-height:1.2}
.hm td,.hm th{border:0;text-align:center;padding:0}
.hm td.cell{width:62px;height:46px;border-radius:6px;font-weight:700;cursor:pointer;font-size:15px;color:#1c2330}
.hm td.cell.sel{outline:3px solid var(--pri)}
.hm .axis{font-size:12px;color:var(--mut);padding:2px 6px}
